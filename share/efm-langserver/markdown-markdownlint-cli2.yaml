# yaml-language-server: $schema=https://raw.githubusercontent.com/mattn/efm-langserver/refs/heads/master/schema.json
---
tools:
  markdown-markdownlint-cli2: &markdown-markdownlint-cli2
    lint-command: "markdownlint-cli2 -"
    lint-stdin: true
    lint-formats:
      - "%f:%l:%c %m"
languages:
  markdown:
    - <<: *markdown-markdownlint-cli2
