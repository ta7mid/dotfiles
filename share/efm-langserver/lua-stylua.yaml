# yaml-language-server: $schema=https://raw.githubusercontent.com/mattn/efm-langserver/refs/heads/master/schema.json
---
tools:
  lua-stylua: &lua-stylua
    format-command: "stylua --color=Never ${--range-start:charStart} ${--range-end:charEnd} --stdin-filepath '${INPUT}' -"
    format-can-range: true
    format-stdin: true
    root-markers:
      - .stylua.toml
      - stylua.toml
languages:
  lua:
    - <<: *lua-stylua
